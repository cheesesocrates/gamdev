<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rather Die Than Get Fired</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preload" href="assets/fonts/Jersey10-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <style>
    @font-face { font-family: "Jersey 10"; src: url("assets/fonts/Jersey10-Regular.ttf") format("truetype"); font-display: swap; }
    html, body { margin: 0; height: 100%; background: #1c1d21; overflow: hidden; }
    #boot { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: #1c1d21; transition: opacity .5s; font-family: "Jersey 10", "Courier New", monospace; color: #f7f4ea; }
    #boot .box { width: min(480px, 86vw); text-align: center; }
    #boot .boot-logo { display: block; width: min(460px, 82vw); margin: 0 auto 22px; }
    #boot .track { height: 20px; border: 3px solid #f7f4ea; border-radius: 2px; overflow: hidden; }
    #boot-bar { height: 100%; width: 0; background: #e9c25a; transition: width .15s; }
    #boot p { margin-top: 16px; font-size: 24px; letter-spacing: 1px; color: #ece5d3; }
  </style>
</head>
<body>
  <div id="game-root"></div>
  <div id="ui"></div>
  <div id="boot">
    <div class="box">
      <img class="boot-logo" src="assets/ui/logo.png" alt="Rather Die Than Get Fired">
      <div class="track"><div id="boot-bar"></div></div>
      <p>LOADING THE OFFICE&hellip;</p>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
